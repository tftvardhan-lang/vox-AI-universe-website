<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Solid Black Circular Emblem -->
  <circle cx="50" cy="50" r="49" fill="#050608" stroke="#1F232E" stroke-width="1.5"/>

  <!-- Left Arm: Descends from top-left, rounds bottom, hooks up into acute V -->
  <path
    d="M 22 13 L 41 82 L 53 66"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-Center Downward Stroke -->
  <path
    d="M 48 10 L 53 30"
    stroke="#FFFFFF"
    stroke-width="10.5"
    stroke-linecap="round"
  />

  <!-- Central Vivid Orange Lens Ring -->
  <circle
    cx="56"
    cy="49"
    r="14"
    stroke="#FF7300"
    stroke-width="9"
    fill="none"
  />

  <!-- Right Arm: Descends from top-right, contours past orange ring to bottom-right -->
  <path
    d="M 76 13 C 71 28, 65 39, 64 47 C 63 55, 65 65, 75 90"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Orange Apex Indicator Dot inside top-right rounded cap -->
  <circle
    cx="76"
    cy="13"
    r="3.4"
    fill="#FF7300"
  />
</svg>
